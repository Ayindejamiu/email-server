<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Certificate Verification – NIEE</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="niee.css" />
  <style>
    body { background: #f4f6f9; min-height: 100vh; }
    .verify-card {
      max-width: 520px;
      margin: 60px auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,102,51,.10);
      overflow: hidden;
    }
    .verify-header {
      background: var(--niee-green, #006633);
      color: #fff;
      padding: 24px 28px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .verify-header img { width: 48px; height: 48px; object-fit: contain; border-radius: 50%; background: #fff; padding: 3px; }
    .verify-header h4 { margin: 0; font-size: 1rem; font-weight: 700; }
    .verify-header p  { margin: 2px 0 0; font-size: .8rem; opacity: .85; }
    .verify-body { padding: 28px; }
    .result-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; font-size: .9rem; }
    .result-row:last-child { border-bottom: none; }
    .result-label { color: #666; font-weight: 500; }
    .result-value { font-weight: 600; color: #111; text-align: right; }
    .badge-valid   { background: #d4edda; color: #155724; padding: 4px 12px; border-radius: 20px; font-size: .82rem; font-weight: 600; }
    .badge-invalid { background: #f8d7da; color: #721c24; padding: 4px 12px; border-radius: 20px; font-size: .82rem; font-weight: 600; }
    .spinner-wrap  { text-align: center; padding: 40px 0; color: #666; }
    .niee-number   { font-family: monospace; font-size: 1.1rem; }
  </style>
</head>
<body>

  <nav class="niee-navbar navbar">
    <div class="container-fluid px-3">
      <a class="navbar-brand" href="index.html">
        <img src="niee-logo.jpg" alt="NIEE Logo" style="width:32px;height:32px;object-fit:contain;border-radius:50%;background:#fff;padding:2px;" />
        NIEE Portal
      </a>
    </div>
  </nav>

  <div class="verify-card">
    <div class="verify-header">
      <img src="niee-logo.jpg" alt="NIEE" />
      <div>
        <h4>Certificate Verification</h4>
        <p>Nigerian Institution of Environmental Engineers</p>
      </div>
    </div>
    <div class="verify-body" id="verifyBody">
      <div class="spinner-wrap">
        <div class="spinner-border text-success" style="width:2.5rem;height:2.5rem;" role="status"></div>
        <div class="mt-3">Verifying certificate…</div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA2shORfx2zny40pH_ATV-VoR8NLXECAoo",
      authDomain: "nieeportal.firebaseapp.com",
      databaseURL: "https://nieeportal-default-rtdb.firebaseio.com",
      projectId: "nieeportal",
      storageBucket: "nieeportal.appspot.com",
      messagingSenderId: "562299924853",
      appId: "1:562299924853:web:235c52db78bc4cd141233c"
    };

    const app = initializeApp(firebaseConfig);
    const db  = getDatabase(app);

    const params  = new URLSearchParams(window.location.search);
    const nieeNo  = (params.get('niee') || '').trim().toUpperCase();
    const bodyEl  = document.getElementById('verifyBody');

    function renderInvalid(msg) {
      bodyEl.innerHTML = `
        <div class="text-center py-3">
          <i class="bi bi-x-circle-fill" style="font-size:2.8rem;color:#dc3545;"></i>
          <h5 class="mt-3 mb-1" style="color:#dc3545;">Verification Failed</h5>
          <p class="text-muted mb-3" style="font-size:.88rem;">${msg}</p>
          <span class="badge-invalid"><i class="bi bi-shield-x me-1"></i>NOT VERIFIED</span>
        </div>`;
    }

    function renderValid(m, nieeNo) {
      const fullName = [m.firstName, m.middleName, m.lastName].filter(Boolean).join(' ') || '—';
      const issueDate = m.reviewedAt
        ? new Date(m.reviewedAt).toLocaleDateString('en-GB', { day: '2-digit', month: 'long', year: 'numeric' })
        : '—';

      bodyEl.innerHTML = `
        <div class="text-center mb-4">
          <i class="bi bi-patch-check-fill" style="font-size:3rem;color:#006633;"></i>
          <h5 class="mt-2 mb-0" style="color:#006633;">Certificate Verified</h5>
          <p class="text-muted" style="font-size:.82rem;">This is a valid NIEE membership certificate.</p>
          <span class="badge-valid"><i class="bi bi-shield-check me-1"></i>VERIFIED &amp; AUTHENTIC</span>
        </div>
        <div class="result-row">
          <span class="result-label">Full Name</span>
          <span class="result-value">${fullName}</span>
        </div>
        <div class="result-row">
          <span class="result-label">NIEE Number</span>
          <span class="result-value niee-number">${nieeNo}</span>
        </div>
        <div class="result-row">
          <span class="result-label">Membership Grade</span>
          <span class="result-value">${m.membershipType || '—'}</span>
        </div>
        <div class="result-row">
          <span class="result-label">Chapter</span>
          <span class="result-value">${m.chapter || '—'}</span>
        </div>
        <div class="result-row">
          <span class="result-label">Date Approved</span>
          <span class="result-value">${issueDate}</span>
        </div>
        <div class="result-row">
          <span class="result-label">Status</span>
          <span class="result-value" style="color:#006633;">${m.status || 'Approved'}</span>
        </div>
        <p class="text-muted mt-4 mb-0" style="font-size:.75rem;text-align:center;">
          Verified via NIEE Member Registry &middot; nieeportal.web.app
        </p>`;
    }

    async function verify() {
      if (!nieeNo) {
        renderInvalid('No NIEE number provided. Please scan a valid NIEE certificate QR code.');
        return;
      }

      try {
        // Look up in members_registry (keyed by nieeNumber)
        const snap = await get(ref(db, `members_registry/${nieeNo}`));
        if (!snap.exists()) {
          renderInvalid(`No member found with NIEE number <strong>${nieeNo}</strong>. The certificate may be invalid or the number may be incorrect.`);
          return;
        }
        const m = snap.val();
        if ((m.status || '').toLowerCase() !== 'approved') {
          renderInvalid(`The member with NIEE number <strong>${nieeNo}</strong> does not have an active approved status.`);
          return;
        }
        renderValid(m, nieeNo);
      } catch (err) {
        renderInvalid('Could not connect to the NIEE registry. Please check your internet connection and try again.');
        console.error('Verify error:', err);
      }
    }

    verify();
  </script>
</body>
</html>
