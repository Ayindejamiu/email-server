<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Member Login – NIEE Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="niee.css" />
</head>
<body>
  <div class="niee-auth-wrapper">
    <div class="niee-auth-card">

      <!-- Card header -->
      <div class="niee-auth-header">
        <div style="margin:0 auto .75rem;width:70px;height:70px;background:#fff;border-radius:50%;padding:4px;box-shadow:0 2px 10px rgba(0,0,0,.2);">
          <img src="niee-logo.jpg" alt="NIEE Logo" style="width:100%;height:100%;object-fit:contain;border-radius:50%;" />
        </div>
        <h4>Member Login</h4>
        <p>Nigerian Institution of Environmental Engineers</p>
      </div>

      <!-- Card body -->
      <div class="niee-auth-body">
        <form id="loginForm" novalidate>

          <div class="mb-3">
            <label for="loginEmail" class="form-label fw-600" style="font-size:.88rem;">Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-white border-end-0">
                <i class="bi bi-envelope text-muted" style="font-size:.9rem;"></i>
              </span>
              <input type="email" id="loginEmail" class="form-control border-start-0 ps-0"
                     placeholder="your@email.com" autocomplete="email" required />
            </div>
          </div>

          <div class="mb-4">
            <div class="d-flex justify-content-between align-items-center">
              <label for="loginPassword" class="form-label fw-600 mb-0" style="font-size:.88rem;">Password</label>
              <a href="#" class="text-niee" style="font-size:.82rem;" data-bs-toggle="modal" data-bs-target="#forgotPasswordModal">Forgot password?</a>
            </div>
            <div class="input-group">
              <span class="input-group-text bg-white border-end-0">
                <i class="bi bi-lock text-muted" style="font-size:.9rem;"></i>
              </span>
              <input type="password" id="loginPassword" class="form-control border-start-0 ps-0"
                     placeholder="Enter your password" autocomplete="current-password" required />
              <button type="button" class="input-group-text bg-white border-start-0"
                      onclick="togglePwd('loginPassword', this)" title="Toggle password">
                <i class="bi bi-eye text-muted" style="font-size:.9rem;"></i>
              </button>
            </div>
          </div>

          <div class="d-grid mb-3">
            <button type="submit" class="btn btn-niee py-2">
              <i class="bi bi-box-arrow-in-right me-1"></i> Login
            </button>
          </div>
        </form>

        <hr class="my-3" />
        <p class="text-center mb-0" style="font-size:.88rem;">
          Don't have an account? <a href="register.html" class="text-niee fw-600">Register here</a>
        </p>
        <p class="text-center mt-2 mb-0" style="font-size:.82rem;">
          <a href="admin-login.html" class="text-muted">Admin login</a>
        </p>
      </div>
    </div>
  </div>

  <!-- Forgot Password Modal -->
  <div class="modal fade" id="forgotPasswordModal" tabindex="-1" aria-labelledby="forgotPasswordModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title fw-bold" id="forgotPasswordModalLabel">Reset Password</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body pt-2">
          <p style="font-size:.88rem;" class="text-muted">Enter your registered email address and we'll send you a password reset link.</p>
          <div id="resetMessage"></div>
          <div class="mb-3">
            <label for="resetEmail" class="form-label fw-600" style="font-size:.88rem;">Email Address</label>
            <input type="email" id="resetEmail" class="form-control" placeholder="your@email.com" autocomplete="email" />
          </div>
        </div>
        <div class="modal-footer border-0 pt-0">
          <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-niee btn-sm" id="sendResetBtn">
            <i class="bi bi-envelope me-1"></i>Send Reset Link
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function togglePwd(id, btn) {
      const inp = document.getElementById(id);
      const icon = btn.querySelector('i');
      if (inp.type === 'password') {
        inp.type = 'text';
        icon.classList.replace('bi-eye', 'bi-eye-slash');
      } else {
        inp.type = 'password';
        icon.classList.replace('bi-eye-slash', 'bi-eye');
      }
    }
  </script>
  <script type="module" src="auth.js"></script>
</body>
</html>
